name: live_systems_gallery
version: 1.0.0+1
publish_to: none

description: A premium Aura-Bento responsive Flutter portfolio with projects, admin control, local persistence, screenshots, and live project links.

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  file_picker: ^8.3.7
  idb_shim: ^2.6.0+5
  shared_preferences: ^2.3.5
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/cinematic-hero.png
    - assets/images/hero/

  # Aura-Bento typography (§2.2): Inter for interface chrome,
  # Instrument Serif for conversational display headlines.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/inter/Inter-Italic.ttf
          style: italic
          weight: 400
        - asset: assets/fonts/inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/inter/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/inter/Inter-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/inter/Inter-Black.ttf
          weight: 900
    - family: InstrumentSerif
      fonts:
        - asset: assets/fonts/instrument/InstrumentSerif-Regular.ttf
        - asset: assets/fonts/instrument/InstrumentSerif-Italic.ttf
          style: italic
