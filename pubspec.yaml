name: live_systems_gallery
version: 1.0.0+1
publish_to: none

description: A premium responsive Flutter portfolio with projects, admin control, local persistence, screenshots, and live project links.

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  file_picker: ^8.3.7
  idb_shim: ^2.6.0+5
  shared_preferences: ^2.3.5
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/cinematic-hero.png
